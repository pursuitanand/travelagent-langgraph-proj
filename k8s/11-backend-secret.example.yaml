# ---------------------------------------------------------------------------
# TEMPLATE ONLY - do not put real keys in this file, and do not commit a copy
# that has them. `k8s/secret.yaml` is git-ignored for exactly this reason.
#
# Preferred: create the Secret straight from your shell so the values never
# touch the repository at all.
#
#   kubectl -n travel-agent create secret generic langgraph-travel-agent-secrets \
#     --from-literal=SERPER_API_KEY="$SERPER_API_KEY" \
#     --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
#     --from-literal=DATABASE_URL=""
#
# To rotate a value:
#
#   kubectl -n travel-agent create secret generic langgraph-travel-agent-secrets \
#     --from-literal=... --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n travel-agent rollout restart deployment/langgraph-travel-agent
#
# The Deployment references this Secret with `optional: true`, so the service
# starts without it: web search is skipped and replies fall back to the
# deterministic template responder.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: langgraph-travel-agent-secrets
  namespace: travel-agent
  labels:
    app.kubernetes.io/name: langgraph-travel-agent
    app.kubernetes.io/part-of: travel-agent
type: Opaque
stringData:
  # https://serper.dev
  SERPER_API_KEY: ""
  # https://console.anthropic.com
  ANTHROPIC_API_KEY: ""
  # https://app.duffel.com -> Developers -> Access tokens
  # Required only when FLIGHT_REPOSITORY=duffel.
  DUFFEL_ACCESS_TOKEN: ""
  # postgresql://user:password@host:5432/travel_agent
  DATABASE_URL: ""
