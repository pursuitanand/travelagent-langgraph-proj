# Local two-container topology, mirroring the Kubernetes layout:
# the browser only reaches chat-assistant, which calls the agent by service
# name on the compose network (never localhost).
#
#   docker compose up --build
#   open http://localhost:3000
#
# Secrets come from your shell or a local .env file and are never baked into
# an image. Both are optional - without them the agent skips web search and
# answers with the deterministic template responder.

services:
  langgraph-travel-agent:
    build:
      context: ./services/langgraph-travel-agent
    environment:
      NODE_ENV: production
      PORT: "8080"
      LOG_LEVEL: info
      FLIGHT_REPOSITORY: json
      FLIGHTS_ROLL_DATES: "true"
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      DATABASE_URL: ${DATABASE_URL:-}
    # Not published to the host: only chat-assistant needs to reach it.
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  chat-assistant:
    build:
      context: ./services/chat-assistant
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: info
      # Compose DNS name, the analogue of the Kubernetes service DNS name.
      BACKEND_URL: http://langgraph-travel-agent:8080
      BACKEND_TIMEOUT_MS: "60000"
    ports:
      - "3000:3000"
    depends_on:
      langgraph-travel-agent:
        condition: service_healthy
